name: Release — publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (ignored if an exact version is set)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Optional exact version (e.g. 0.1.1). Takes priority over release_type'
        required: false
        default: ''
        type: string
      branch:
        description: 'Branch to use for release'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Dry run: test everything without publishing or pushing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.inputs.branch }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}
      CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "❌ Error: NPM_TOKEN secret is not set"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          set -e
          CURRENT=$(node -p 'require("./package.json").version')
          PACKAGE_NAME=$(node -p 'require("./package.json").name')

          if [ -n "$CUSTOM_VERSION" ]; then
            TARGET="$CUSTOM_VERSION"
          else
            TARGET="$RELEASE_TYPE"
          fi

          npm version "$TARGET" --no-git-tag-version
          NEXT=$(node -p 'require("./package.json").version')

          # Validations: neither the tag nor the npm version may already exist
          if git rev-parse "refs/tags/$NEXT" >/dev/null 2>&1; then
            echo "❌ Tag $NEXT already exists"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$NEXT" version >/dev/null 2>&1; then
            echo "❌ $PACKAGE_NAME@$NEXT is already published on npm"
            exit 1
          fi

          echo "CURRENT_VERSION=$CURRENT" >> $GITHUB_OUTPUT
          echo "NEXT_VERSION=$NEXT" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          echo "📦 Release plan:"
          echo "   Current: $CURRENT"
          echo "   Next:    $NEXT"

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Dry-run
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "🧪 DRY RUN: would publish ${{ steps.version.outputs.NEXT_VERSION }}"
          npm publish --dry-run --ignore-scripts --access public

      - name: Commit and tag
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          git add package.json
          [ -f package-lock.json ] && git add package-lock.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"

      - name: Publish to npm
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --ignore-scripts: lint + build already ran above, and n8n-node's
        # prepublishOnly (prerelease) is only meant to run inside `n8n-node release`
        run: npm publish --provenance --access public --ignore-scripts

      - name: Push commit and tag
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          git push origin "HEAD:refs/heads/$BRANCH" "refs/tags/$VERSION"

      - name: Create GitHub Release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          gh release create "$VERSION" --title "v$VERSION" --generate-notes --verify-tag

      - name: Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          PACKAGE_NAME="${{ steps.version.outputs.PACKAGE_NAME }}"

          if [ -z "$VERSION" ]; then
            echo "# ❌ Release failed before versioning" >> $GITHUB_STEP_SUMMARY
          elif [ "$DRY_RUN" = "true" ]; then
            echo "# 🧪 Dry Run Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Current version:** ${{ steps.version.outputs.CURRENT_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "**Would release:** $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No changes were made" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" = "success" ]; then
            echo "# ✅ Release v${VERSION} Published!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** $BRANCH" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Links" >> $GITHUB_STEP_SUMMARY
            echo "- **npm:** https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Release:** https://github.com/${{ github.repository }}/releases/tag/${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ Release v${VERSION} failed" >> $GITHUB_STEP_SUMMARY
          fi